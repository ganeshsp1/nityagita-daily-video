name: YouTube maintenance

# Manual: makes every logged upload public and adds it to its language
# playlist. Needs the YouTube token with the "youtube" (manage) permission.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN_ML: ${{ secrets.YT_REFRESH_TOKEN_ML }}
      YT_REFRESH_TOKEN_HI: ${{ secrets.YT_REFRESH_TOKEN_HI }}
      YT_REFRESH_TOKEN_TA: ${{ secrets.YT_REFRESH_TOKEN_TA }}
      YT_REFRESH_TOKEN_TE: ${{ secrets.YT_REFRESH_TOKEN_TE }}
      YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
      YT_REFRESH_TOKEN_KN: ${{ secrets.YT_REFRESH_TOKEN_KN }}
      YT_REFRESH_TOKEN_MR: ${{ secrets.YT_REFRESH_TOKEN_MR }}
      YT_REFRESH_TOKEN_OR: ${{ secrets.YT_REFRESH_TOKEN_OR }}
      YT_REFRESH_TOKEN_BN: ${{ secrets.YT_REFRESH_TOKEN_BN }}
    steps:
      - uses: actions/checkout@v4
      # Per language, since each language may be on its own channel.
      - run: |
          FAILED=0
          for L in $(jq -r '.languages | keys[]' generator/config.json); do
            python3 publish/accounts.py check "$L" youtube || continue
            echo "== $L ($(python3 publish/accounts.py which "$L" youtube) channel)"
            python3 publish/accounts.py run "$L" youtube -- \
              python3 publish/youtube_manage.py backfill --lang "$L" posted/*.jsonl || FAILED=1
          done
          exit $FAILED
