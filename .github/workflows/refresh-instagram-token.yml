name: Refresh Instagram and Threads tokens

# Long-lived Instagram tokens last 60 days and can be refreshed once they are
# at least 24 hours old. Refreshing weekly keeps the token valid indefinitely.
on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 08:30 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_ACCESS_TOKEN_ML: ${{ secrets.IG_ACCESS_TOKEN_ML }}
      IG_ACCESS_TOKEN_HI: ${{ secrets.IG_ACCESS_TOKEN_HI }}
      IG_ACCESS_TOKEN_TA: ${{ secrets.IG_ACCESS_TOKEN_TA }}
      IG_ACCESS_TOKEN_TE: ${{ secrets.IG_ACCESS_TOKEN_TE }}
      IG_ACCESS_TOKEN_EN: ${{ secrets.IG_ACCESS_TOKEN_EN }}
      IG_ACCESS_TOKEN_KN: ${{ secrets.IG_ACCESS_TOKEN_KN }}
      IG_ACCESS_TOKEN_MR: ${{ secrets.IG_ACCESS_TOKEN_MR }}
      IG_ACCESS_TOKEN_OR: ${{ secrets.IG_ACCESS_TOKEN_OR }}
      IG_ACCESS_TOKEN_BN: ${{ secrets.IG_ACCESS_TOKEN_BN }}
      THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
      THREADS_TOKEN_ML: ${{ secrets.THREADS_TOKEN_ML }}
      THREADS_TOKEN_HI: ${{ secrets.THREADS_TOKEN_HI }}
      THREADS_TOKEN_TA: ${{ secrets.THREADS_TOKEN_TA }}
      THREADS_TOKEN_TE: ${{ secrets.THREADS_TOKEN_TE }}
      THREADS_TOKEN_EN: ${{ secrets.THREADS_TOKEN_EN }}
      THREADS_TOKEN_KN: ${{ secrets.THREADS_TOKEN_KN }}
      THREADS_TOKEN_MR: ${{ secrets.THREADS_TOKEN_MR }}
      THREADS_TOKEN_OR: ${{ secrets.THREADS_TOKEN_OR }}
      THREADS_TOKEN_BN: ${{ secrets.THREADS_TOKEN_BN }}
      GH_TOKEN: ${{ secrets.IG_REFRESH_PAT }}
    if: ${{ github.repository_owner == 'ganeshsp1' }}
    steps:
      # Covers the shared token and every per-language one (IG_ACCESS_TOKEN_TA, ...).
      - name: Refresh and store the Instagram tokens
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "IG_REFRESH_PAT not set; skipping."; exit 0; fi
          FAILED=0
          for NAME in $(compgen -e | grep -E '^IG_ACCESS_TOKEN(_[A-Z]+)?$'); do
            TOKEN="${!NAME}"
            [ -n "$TOKEN" ] || continue  # listed but not set
            RESP=$(curl -sS --fail-with-body -G "https://graph.instagram.com/refresh_access_token" \
              --data-urlencode "grant_type=ig_refresh_token" \
              --data-urlencode "access_token=$TOKEN") || { echo "::error::$NAME refresh failed"; FAILED=1; continue; }
            NEW=$(echo "$RESP" | jq -r '.access_token // empty')
            [ -n "$NEW" ] || { echo "::error::No token in $NAME refresh response"; FAILED=1; continue; }
            echo "::add-mask::$NEW"
            printf '%s' "$NEW" | gh secret set "$NAME" -R "${{ github.repository }}"
            echo "$NAME refreshed; expires in $(echo "$RESP" | jq -r '.expires_in') seconds."
          done
          exit $FAILED

      - name: Refresh and store the Threads tokens
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "IG_REFRESH_PAT not set; skipping."; exit 0; fi
          FAILED=0
          for NAME in $(compgen -e | grep -E '^THREADS_TOKEN(_[A-Z]+)?$'); do
            TOKEN="${!NAME}"
            [ -n "$TOKEN" ] || continue  # listed but not set
            RESP=$(curl -sS --fail-with-body -G "https://graph.threads.net/refresh_access_token" \
              --data-urlencode "grant_type=th_refresh_token" \
              --data-urlencode "access_token=$TOKEN") || { echo "::error::$NAME refresh failed"; FAILED=1; continue; }
            NEW=$(echo "$RESP" | jq -r '.access_token // empty')
            [ -n "$NEW" ] || { echo "::error::No token in $NAME refresh response"; FAILED=1; continue; }
            echo "::add-mask::$NEW"
            printf '%s' "$NEW" | gh secret set "$NAME" -R "${{ github.repository }}"
            echo "$NAME refreshed."
          done
          exit $FAILED
