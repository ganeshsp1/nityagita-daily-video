name: Promo videos

# Posts the app promo videos (promo/), the next one per language each run,
# to the same accounts as the daily verse videos. The videos are the
# assets of the promo-v1 release; promo/post.py keeps posted/promo.jsonl so
# nothing is posted twice.
on:
  schedule:
    - cron: "30 12 * * 2,5" # Tue and Fri, 18:00 IST
  workflow_dispatch:
    inputs:
      languages:
        description: "Space-separated language codes. Empty = all promo languages"
        required: false
      platforms:
        description: "Where to post (space-separated)"
        required: false
        default: "youtube instagram facebook threads"
      dry_run:
        description: "Only show what would be posted"
        type: boolean
        default: false

permissions:
  contents: write # commit posted/promo.jsonl

concurrency:
  group: promo-video
  cancel-in-progress: false

jobs:
  post:
    if: github.event_name != 'schedule' || github.repository == 'ganeshsp1/nityagita-daily-video'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
      PROMO_TAG: promo-v1
    steps:
      - uses: actions/checkout@v4

      - name: Post the next promo per language
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_ML: ${{ secrets.YT_REFRESH_TOKEN_ML }}
          YT_REFRESH_TOKEN_HI: ${{ secrets.YT_REFRESH_TOKEN_HI }}
          YT_REFRESH_TOKEN_TA: ${{ secrets.YT_REFRESH_TOKEN_TA }}
          YT_REFRESH_TOKEN_TE: ${{ secrets.YT_REFRESH_TOKEN_TE }}
          YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
          YT_REFRESH_TOKEN_KN: ${{ secrets.YT_REFRESH_TOKEN_KN }}
          YT_REFRESH_TOKEN_MR: ${{ secrets.YT_REFRESH_TOKEN_MR }}
          YT_REFRESH_TOKEN_OR: ${{ secrets.YT_REFRESH_TOKEN_OR }}
          YT_REFRESH_TOKEN_BN: ${{ secrets.YT_REFRESH_TOKEN_BN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID_ML: ${{ secrets.IG_USER_ID_ML }}
          IG_ACCESS_TOKEN_ML: ${{ secrets.IG_ACCESS_TOKEN_ML }}
          IG_USER_ID_HI: ${{ secrets.IG_USER_ID_HI }}
          IG_ACCESS_TOKEN_HI: ${{ secrets.IG_ACCESS_TOKEN_HI }}
          IG_USER_ID_TA: ${{ secrets.IG_USER_ID_TA }}
          IG_ACCESS_TOKEN_TA: ${{ secrets.IG_ACCESS_TOKEN_TA }}
          IG_USER_ID_TE: ${{ secrets.IG_USER_ID_TE }}
          IG_ACCESS_TOKEN_TE: ${{ secrets.IG_ACCESS_TOKEN_TE }}
          IG_USER_ID_EN: ${{ secrets.IG_USER_ID_EN }}
          IG_ACCESS_TOKEN_EN: ${{ secrets.IG_ACCESS_TOKEN_EN }}
          IG_USER_ID_KN: ${{ secrets.IG_USER_ID_KN }}
          IG_ACCESS_TOKEN_KN: ${{ secrets.IG_ACCESS_TOKEN_KN }}
          IG_USER_ID_MR: ${{ secrets.IG_USER_ID_MR }}
          IG_ACCESS_TOKEN_MR: ${{ secrets.IG_ACCESS_TOKEN_MR }}
          IG_USER_ID_OR: ${{ secrets.IG_USER_ID_OR }}
          IG_ACCESS_TOKEN_OR: ${{ secrets.IG_ACCESS_TOKEN_OR }}
          IG_USER_ID_BN: ${{ secrets.IG_USER_ID_BN }}
          IG_ACCESS_TOKEN_BN: ${{ secrets.IG_ACCESS_TOKEN_BN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID_ML: ${{ secrets.FB_PAGE_ID_ML }}
          FB_PAGE_TOKEN_ML: ${{ secrets.FB_PAGE_TOKEN_ML }}
          FB_PAGE_ID_HI: ${{ secrets.FB_PAGE_ID_HI }}
          FB_PAGE_TOKEN_HI: ${{ secrets.FB_PAGE_TOKEN_HI }}
          FB_PAGE_ID_TA: ${{ secrets.FB_PAGE_ID_TA }}
          FB_PAGE_TOKEN_TA: ${{ secrets.FB_PAGE_TOKEN_TA }}
          FB_PAGE_ID_TE: ${{ secrets.FB_PAGE_ID_TE }}
          FB_PAGE_TOKEN_TE: ${{ secrets.FB_PAGE_TOKEN_TE }}
          FB_PAGE_ID_EN: ${{ secrets.FB_PAGE_ID_EN }}
          FB_PAGE_TOKEN_EN: ${{ secrets.FB_PAGE_TOKEN_EN }}
          FB_PAGE_ID_KN: ${{ secrets.FB_PAGE_ID_KN }}
          FB_PAGE_TOKEN_KN: ${{ secrets.FB_PAGE_TOKEN_KN }}
          FB_PAGE_ID_MR: ${{ secrets.FB_PAGE_ID_MR }}
          FB_PAGE_TOKEN_MR: ${{ secrets.FB_PAGE_TOKEN_MR }}
          FB_PAGE_ID_OR: ${{ secrets.FB_PAGE_ID_OR }}
          FB_PAGE_TOKEN_OR: ${{ secrets.FB_PAGE_TOKEN_OR }}
          FB_PAGE_ID_BN: ${{ secrets.FB_PAGE_ID_BN }}
          FB_PAGE_TOKEN_BN: ${{ secrets.FB_PAGE_TOKEN_BN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_USER_ID_ML: ${{ secrets.THREADS_USER_ID_ML }}
          THREADS_TOKEN_ML: ${{ secrets.THREADS_TOKEN_ML }}
          THREADS_USER_ID_HI: ${{ secrets.THREADS_USER_ID_HI }}
          THREADS_TOKEN_HI: ${{ secrets.THREADS_TOKEN_HI }}
          THREADS_USER_ID_TA: ${{ secrets.THREADS_USER_ID_TA }}
          THREADS_TOKEN_TA: ${{ secrets.THREADS_TOKEN_TA }}
          THREADS_USER_ID_TE: ${{ secrets.THREADS_USER_ID_TE }}
          THREADS_TOKEN_TE: ${{ secrets.THREADS_TOKEN_TE }}
          THREADS_USER_ID_EN: ${{ secrets.THREADS_USER_ID_EN }}
          THREADS_TOKEN_EN: ${{ secrets.THREADS_TOKEN_EN }}
          THREADS_USER_ID_KN: ${{ secrets.THREADS_USER_ID_KN }}
          THREADS_TOKEN_KN: ${{ secrets.THREADS_TOKEN_KN }}
          THREADS_USER_ID_MR: ${{ secrets.THREADS_USER_ID_MR }}
          THREADS_TOKEN_MR: ${{ secrets.THREADS_TOKEN_MR }}
          THREADS_USER_ID_OR: ${{ secrets.THREADS_USER_ID_OR }}
          THREADS_TOKEN_OR: ${{ secrets.THREADS_TOKEN_OR }}
          THREADS_USER_ID_BN: ${{ secrets.THREADS_USER_ID_BN }}
          THREADS_TOKEN_BN: ${{ secrets.THREADS_TOKEN_BN }}
        run: |
          ARGS=(--base "https://github.com/${{ github.repository }}/releases/download/$PROMO_TAG")
          [ -n "${{ inputs.languages }}" ] && ARGS+=(--langs ${{ inputs.languages }})
          ARGS+=(--platforms ${{ inputs.platforms || 'youtube instagram facebook threads' }})
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS+=(--dry-run)
          python3 promo/post.py "${ARGS[@]}"

      - name: Record what was posted
        if: always() && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898199+github-actions[bot]@users.noreply.github.com"
          git add posted/promo.jsonl 2>/dev/null || true
          git diff --cached --quiet || { git commit -q -m "posted: promo videos"; git push -q; }
