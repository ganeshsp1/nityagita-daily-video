name: Daily verse video

on:
  # The main trigger is the Cloudflare Worker in cloudflare/ (06:00 IST).
  # These GitHub schedules are backups in case it fails; GitHub often runs
  # them late. Whichever run comes first posts; later ones stop early.
  schedule:
    - cron: "53 1 * * *" # 07:23 IST
    - cron: "23 3 * * *" # 08:53 IST
  workflow_dispatch:
    inputs:
      date:
        description: "Date (YYYY-MM-DD, IST). Empty = today"
        required: false
      languages:
        description: "Space-separated language codes. Empty = repo default"
        required: false
      publish:
        description: "Post to YouTube / Instagram"
        type: boolean
        default: true
      force:
        description: "Re-generate even if today is already posted"
        type: boolean
        default: false
      platforms:
        description: "Where to post (space-separated)"
        required: false
        default: "youtube instagram facebook threads"

permissions:
  contents: write # create the daily release and commit the posted log

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  video:
    # Forks have neither the secrets nor the accounts; only run scheduled jobs here.
    if: github.event_name != 'schedule' || github.repository == 'ganeshsp1/nityagita-daily-video'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITA_WORKER_URL: ${{ vars.GITA_WORKER_URL }}
      GITA_WORKER_TOKEN: ${{ secrets.GITA_WORKER_TOKEN }}
      YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
      PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
      PLATFORMS: ${{ inputs.platforms || 'youtube instagram facebook threads' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - name: Pick date and languages
        run: |
          DATE="${{ inputs.date }}"
          [ -z "$DATE" ] && DATE=$(TZ=Asia/Kolkata date +%F)
          LANGS="${{ inputs.languages }}"
          [ -z "$LANGS" ] && LANGS="${{ vars.VIDEO_LANGS }}"
          [ -z "$LANGS" ] && LANGS=$(python3 -c "import json;print(' '.join(json.load(open('generator/config.json'))['default_languages']))")
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          echo "LANGS=$LANGS" >> "$GITHUB_ENV"
          echo "WORK=$RUNNER_TEMP/work" >> "$GITHUB_ENV"
          echo "Date $DATE, languages: $LANGS"

      # Each language posts to its own account when it has one (secrets named
      # like IG_ACCESS_TOKEN_TA), else to the shared one. See publish/accounts.py.
      - name: Skip if today is already posted
        if: ${{ !inputs.force }}
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          LOG="posted/${DATE:0:7}.jsonl"
          for L in $LANGS; do
            for P in youtube instagram facebook threads; do
              python3 publish/accounts.py check "$L" "$P" || continue
              if ! { [ -f "$LOG" ] && jq -e --arg d "$DATE" --arg l "$L" --arg p "$P" \
                  'select(.date==$d and .lang==$l and .[$p] != null)' "$LOG" > /dev/null; }; then
                echo "Still to post: $L on $P"; exit 0
              fi
            done
          done
          echo "Everything for $DATE is already posted."
          echo "ALL_DONE=1" >> "$GITHUB_ENV"

      # Ubuntu mirrors are occasionally very slow; cap each attempt and retry.
      - name: Install ffmpeg and Noto fonts
        if: env.ALL_DONE != '1'
        run: |
          for i in 1 2 3; do
            if timeout 300 sudo apt-get update -qq -o Acquire::Retries=3 &&
               timeout 300 sudo apt-get install -y -qq --no-install-recommends \
                 -o Acquire::Retries=3 ffmpeg fonts-noto-core > /dev/null; then
              exit 0
            fi
            echo "apt attempt $i failed or timed out; retrying"
            sleep 10
          done
          exit 1

      # Downloads go to the runner's temp folder, which is wiped after the run.
      # Never upload them as artifacts: artifacts in a public repo are public.
      - name: Generate videos
        if: env.ALL_DONE != '1'
        run: |
          for L in $LANGS; do
            python3 generator/make_video.py --date "$DATE" --lang "$L" --out "$WORK/$L"
            cp "$WORK/$L/video.mp4" "$WORK/nityagita-$DATE-$L.mp4"
          done

      - name: Publish release (public video URLs)
        if: env.ALL_DONE != '1'
        run: |
          TAG="video-$DATE"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            {
              echo "Verse of the day for $DATE."
              for L in $LANGS; do echo "- $L: $(jq -r .youtube_title "$WORK/$L/meta.json")"; done
            } > "$WORK/notes.md"
            gh release create "$TAG" --title "Verse of the day · $DATE" --notes-file "$WORK/notes.md"
          fi
          gh release upload "$TAG" --clobber "$WORK"/nityagita-"$DATE"-*.mp4

      # Skips a language if the posted log already has a link for it today,
      # so late scheduled runs and manual re-runs never post twice.
      - name: Upload to YouTube
        continue-on-error: true
        if: env.ALL_DONE != '1' && env.PUBLISH == 'true' && contains(env.PLATFORMS, 'youtube')
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          FAILED=0
          for L in $LANGS; do
            if [ -f "posted/${DATE:0:7}.jsonl" ] && jq -e --arg d "$DATE" --arg l "$L" \
                'select(.date==$d and .lang==$l and .youtube != null)' "posted/${DATE:0:7}.jsonl" > /dev/null; then
              echo "$L already on YouTube for $DATE; skipping"; continue
            fi
            python3 publish/accounts.py check "$L" youtube || { echo "$L has no youtube account; skipping"; continue; }
            if URL=$(python3 publish/accounts.py run "$L" youtube -- python3 publish/youtube_upload.py "$WORK/$L/video.mp4" "$WORK/$L/meta.json"); then
              echo "$L youtube $URL"
              python3 publish/accounts.py run "$L" youtube -- python3 publish/youtube_manage.py add "$L" "$URL" \
                || echo "::warning::Could not add $L to its playlist (re-run tools/get_youtube_token.py for the playlist permission)"
              jq --arg u "$URL" '.youtube=$u' "$WORK/$L/meta.json" > "$WORK/$L/m" && mv "$WORK/$L/m" "$WORK/$L/meta.json"
            else
              echo "::error::YouTube upload failed for $L"; FAILED=1
            fi
          done
          exit $FAILED

      - name: Post to Instagram
        continue-on-error: true
        if: env.ALL_DONE != '1' && env.PUBLISH == 'true' && contains(env.PLATFORMS, 'instagram')
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          FAILED=0
          BASE="https://github.com/${{ github.repository }}/releases/download/video-$DATE"
          for L in $LANGS; do
            if [ -f "posted/${DATE:0:7}.jsonl" ] && jq -e --arg d "$DATE" --arg l "$L" \
                'select(.date==$d and .lang==$l and .instagram != null)' "posted/${DATE:0:7}.jsonl" > /dev/null; then
              echo "$L already on Instagram for $DATE; skipping"; continue
            fi
            python3 publish/accounts.py check "$L" instagram || { echo "$L has no instagram account; skipping"; continue; }
            if URL=$(python3 publish/accounts.py run "$L" instagram -- python3 publish/instagram_post.py "$BASE/nityagita-$DATE-$L.mp4" "$WORK/$L/meta.json"); then
              echo "$L instagram $URL"
              jq --arg u "$URL" '.instagram=$u' "$WORK/$L/meta.json" > "$WORK/$L/m" && mv "$WORK/$L/m" "$WORK/$L/meta.json"
            else
              echo "::error::Instagram post failed for $L"; FAILED=1
            fi
          done
          exit $FAILED

      - name: Post to Facebook Page
        continue-on-error: true
        if: env.ALL_DONE != '1' && env.PUBLISH == 'true' && contains(env.PLATFORMS, 'facebook')
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          FAILED=0
          BASE="https://github.com/${{ github.repository }}/releases/download/video-$DATE"
          for L in $LANGS; do
            if [ -f "posted/${DATE:0:7}.jsonl" ] && jq -e --arg d "$DATE" --arg l "$L" \
                'select(.date==$d and .lang==$l and .facebook != null)' "posted/${DATE:0:7}.jsonl" > /dev/null; then
              echo "$L already on Facebook for $DATE; skipping"; continue
            fi
            python3 publish/accounts.py check "$L" facebook || { echo "$L has no facebook account; skipping"; continue; }
            if URL=$(python3 publish/accounts.py run "$L" facebook -- python3 publish/facebook_post.py "$BASE/nityagita-$DATE-$L.mp4" "$WORK/$L/meta.json"); then
              echo "$L facebook $URL"
              jq --arg u "$URL" '.facebook=$u' "$WORK/$L/meta.json" > "$WORK/$L/m" && mv "$WORK/$L/m" "$WORK/$L/meta.json"
            else
              echo "::error::Facebook post failed for $L"; FAILED=1
            fi
          done
          exit $FAILED

      - name: Post to Threads
        continue-on-error: true
        if: env.ALL_DONE != '1' && env.PUBLISH == 'true' && contains(env.PLATFORMS, 'threads')
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          FAILED=0
          BASE="https://github.com/${{ github.repository }}/releases/download/video-$DATE"
          for L in $LANGS; do
            if [ -f "posted/${DATE:0:7}.jsonl" ] && jq -e --arg d "$DATE" --arg l "$L" \
                'select(.date==$d and .lang==$l and .threads != null)' "posted/${DATE:0:7}.jsonl" > /dev/null; then
              echo "$L already on Threads for $DATE; skipping"; continue
            fi
            python3 publish/accounts.py check "$L" threads || { echo "$L has no threads account; skipping"; continue; }
            if URL=$(python3 publish/accounts.py run "$L" threads -- python3 publish/threads_post.py "$BASE/nityagita-$DATE-$L.mp4" "$WORK/$L/meta.json"); then
              echo "$L threads $URL"
              jq --arg u "$URL" '.threads=$u' "$WORK/$L/meta.json" > "$WORK/$L/m" && mv "$WORK/$L/m" "$WORK/$L/meta.json"
            else
              echo "::error::Threads post failed for $L"; FAILED=1
            fi
          done
          exit $FAILED

      # A commit per run also keeps the schedule alive: GitHub disables
      # scheduled workflows in public repos after 60 days without activity.
      - name: Record what was posted
        if: always() && env.DATE != '' && env.ALL_DONE != '1'
        run: |
          mkdir -p posted
          for L in $LANGS; do
            [ -f "$WORK/$L/meta.json" ] || continue
            jq -c '{date, lang, ref, section_count, youtube_title, youtube, instagram, facebook, threads}' "$WORK/$L/meta.json" >> "posted/${DATE:0:7}.jsonl"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898199+github-actions[bot]@users.noreply.github.com"
          git add posted
          git diff --cached --quiet || { git commit -q -m "posted: $DATE ($LANGS)"; git push -q; }
